name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod

      - name: Build binaries
        run: |
          cd mcp
          mkdir -p ../dist
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-darwin-arm64      .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-darwin-amd64      .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-linux-arm64       .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-linux-amd64       .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-windows-amd64.exe .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version from tag
        working-directory: npm
        run: npm version ${{ github.ref_name }} --no-git-tag-version

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
