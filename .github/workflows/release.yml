name: Release

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      mcp_changed: ${{ steps.check.outputs.mcp_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if mcp/ changed since last tag
        id: check
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            # First tag ever — always release
            echo "mcp_changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$PREV" HEAD -- mcp/ | grep -q .; then
            echo "mcp_changed=true" >> $GITHUB_OUTPUT
          else
            echo "mcp_changed=false" >> $GITHUB_OUTPUT
            echo "No changes in mcp/ since $PREV — skipping release"
          fi

  release:
    needs: check
    if: needs.check.outputs.mcp_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod

      - name: Build binaries
        run: |
          cd mcp
          mkdir -p ../dist
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-darwin-arm64      .
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-darwin-amd64      .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-linux-arm64       .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-linux-amd64       .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agentmfa-mcp-windows-amd64.exe .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
